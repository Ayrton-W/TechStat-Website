<!doctype html>
<html>

<head>
  <link href="https://fonts.googleapis.com/css?family=Inter&display=swap" rel="stylesheet" />
  <link href="../css/adminLogin.css" rel="stylesheet" />
  <title>Document</title>
</head>

<body>
  <div class="entireAdminLoginPage">
    <!-- TechStat banner -->
    <div class="techstatBanner"></div>

    <!-- Main content area -->
    <!-- Login Box -->
    <div class="divLogin">
      <div class="loginBox">
        <h2>Techstat Admin Login</h2>
        <form>
          <input type="text" placeholder="Username" required />
          <input type="password" placeholder="Password" required />
          <button type="submit" class="login-btn">Login</button>
          <button type="cancel" class="cancel-btn">Cancel</button>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <div class="divMoreinfo">
      <span class="lblTechstat">TECHSTAT</span>
    </div>
  </div>
  <script src="../javascript/adminLogin.js"></script>
</body>

</html>
